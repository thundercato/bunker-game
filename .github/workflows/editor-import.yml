name: Import Field Signal editor checkpoint
on:
  push:
    branches: [field-signal-editor]
    paths:
      - field-signal-editor-source.json
      - .github/workflows/editor-import.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: field-signal-editor-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and stage editor source
        run: |
          python3 - <<'PY'
          import hashlib,io,json,pathlib,shutil,stat,urllib.request,zipfile
          root=pathlib.Path.cwd()
          pointer=root/'field-signal-editor-source.json'
          spec=json.loads(pointer.read_text())
          if not spec['url'].startswith('https://d2ol7oe51mr4n9.cloudfront.net/'):
              raise ValueError('Unapproved checkpoint domain')
          raw=urllib.request.urlopen(spec['url'],timeout=120).read()
          if hashlib.sha256(raw).hexdigest()!=spec['sha256']:
              raise ValueError('Editor source hash mismatch')
          stage=pathlib.Path('/tmp/field-signal-editor')
          if stage.exists():shutil.rmtree(stage)
          stage.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if sum(i.file_size for i in z.infolist())>350_000_000:
                  raise ValueError('Uncompressed source exceeds limit')
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0]=='.git' or stat.S_ISLNK(i.external_attr>>16):
                      raise ValueError('Unsafe archive path')
                  if p.suffix.lower() in ('.ttf','.otf','.woff','.woff2'):
                      raise ValueError('Bundled font file is not allowed')
                  if p.parts[0]=='.github':
                      continue
                  if i.is_dir():
                      (stage/p).mkdir(parents=True,exist_ok=True)
                  else:
                      destination=stage/p
                      destination.parent.mkdir(parents=True,exist_ok=True)
                      destination.write_bytes(z.read(i))
          for path in ('site/editor/index.html','site/editor/editor.js','site/layout-core.js','site/layout-preview.js','site/world-layout.js','site/engine.py','site/world.json','site/tests/test_layout.mjs','tools/build.py','README.md','docs/EDITOR.md'):
              if not (stage/path).is_file():raise ValueError('Incomplete editor source: '+path)
          for child in root.iterdir():
              if child.name in ('.git','.github','field-signal-editor-source.json'):continue
              if child.is_dir():shutil.rmtree(child)
              else:child.unlink()
          for child in stage.iterdir():
              if child.is_dir():shutil.copytree(child,root/child.name)
              else:shutil.copy2(child,root/child.name)
          print('Verified and staged:',spec['label'])
          PY
      - name: Test imported editor and game rules
        run: |
          python3 -m unittest discover -s site/tests -p 'test_*.py' -q
          node site/tests/test_layout.mjs
          python3 tools/build.py
      - name: Commit editor checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add desktop world editor, collision-aware layout and preview'
            git push origin HEAD:field-signal-editor
          fi
