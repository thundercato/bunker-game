name: Import Overgrowth v11 checkpoint
on:
  push:
    branches: [field-signal-v11]
    paths: [field-signal-v11-source.json, .github/workflows/overgrowth-import.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: field-signal-v11-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and unpack development checkpoint
        run: |
          python3 - <<'PY'
          import hashlib, io, json, pathlib, shutil, stat, urllib.request, zipfile
          root=pathlib.Path.cwd()
          pointer=root/'field-signal-v11-source.json'
          if not pointer.exists():
              print('Waiting for a verified source pointer.')
              raise SystemExit(0)
          spec=json.loads(pointer.read_text())
          if not spec['url'].startswith('https://d2ol7oe51mr4n9.cloudfront.net/'):
              raise ValueError('Unexpected checkpoint host')
          raw=urllib.request.urlopen(spec['url'],timeout=120).read()
          if hashlib.sha256(raw).hexdigest()!=spec['sha256']:
              raise ValueError('Checkpoint hash mismatch')
          stage=pathlib.Path('/tmp/overgrowth-checkpoint')
          if stage.exists(): shutil.rmtree(stage)
          stage.mkdir()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              if sum(e.file_size for e in archive.infolist())>350_000_000:
                  raise ValueError('Checkpoint too large')
              for e in archive.infolist():
                  p=pathlib.PurePosixPath(e.filename)
                  if p.is_absolute() or '..' in p.parts or not p.parts or p.parts[0] in ('.git','.github') or stat.S_ISLNK(e.external_attr>>16):
                      raise ValueError('Unsafe archive path')
                  if p.suffix.lower() in ('.ttf','.otf','.woff','.woff2'):
                      raise ValueError('Font binary not part of this project')
              archive.extractall(stage)
          for name in ('site/world-v11.js','site/engine.py','site/assets/v11/models.json','site/release.json','README.md','tools/build.py'):
              if not (stage/name).is_file(): raise ValueError('Incomplete checkpoint '+name)
          for child in root.iterdir():
              if child.name in ('.git','.github','field-signal-v11-source.json'): continue
              if child.is_dir(): shutil.rmtree(child)
              else: child.unlink()
          for child in stage.iterdir():
              if child.name=='field-signal-v11-source.json': continue
              if child.is_dir(): shutil.copytree(child,root/child.name)
              else: shutil.copy2(child,root/child.name)
          print('Imported',spec['label'])
          PY
      - name: Save development checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'feat: checkpoint Overgrowth v11 environmental overhaul'
            git push origin HEAD:field-signal-v11
          fi
