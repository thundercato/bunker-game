name: Validate and deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - ci-diagnostic.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Diagnose, validate and build
        shell: bash
        run: |
          set +e
          : > ci-diagnostic.txt
          overall=0

          run_check() {
            label="$1"
            shift
            echo "===== $label =====" | tee -a ci-diagnostic.txt
            "$@" 2>&1 | tee -a ci-diagnostic.txt
            code=${PIPESTATUS[0]}
            echo "EXIT CODE: $code" | tee -a ci-diagnostic.txt
            echo | tee -a ci-diagnostic.txt
            if [ "$code" -ne 0 ]; then
              overall=1
            fi
          }

          run_check "FORMAT" npm run format:check
          run_check "LINT" npm run lint
          run_check "TYPECHECK" npm run typecheck
          run_check "TEST" npm run test
          run_check "BUILD" npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostic.txt
          git commit -m "chore: record CI diagnostics" || true
          git push || true

          exit "$overall"

      - name: Configure Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
