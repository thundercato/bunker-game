name: Godot release build

on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-control-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot-control-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import and export Godot web build
        working-directory: godot
        env:
          HOME: /root
        run: |
          mkdir -p ../godot-build
          godot --headless --editor --quit
          godot --headless --script res://tests/headless_smoke.gd
          godot --headless --export-release Web ../godot-build/index.html
      - name: Record exported release
        run: printf '%s\n' '{"version":"0.0.0.4","engine":"Godot 4.3","status":"pixel-art-overhaul"}' > godot-build/build.json
      - uses: actions/upload-artifact@v4
        with:
          name: godot-release-build
          path: godot-build
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - name: Preserve the Phaser release as a fallback
        run: |
          mv dist phaser-legacy
          mkdir -p dist/phaser-legacy
          cp -R phaser-legacy/. dist/phaser-legacy/
      - uses: actions/download-artifact@v4
        with:
          name: godot-release-build
          path: dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Godot release with Phaser fallback
        id: deployment
        uses: actions/deploy-pages@v4
